name: Auto Sync Database from Field PWA
on:
  repository_dispatch:
    types: [pwa_update_asset]

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Process and Merge Asset Data
        run: |
          echo "Menerima data baru dari lapangan..."
          # Ambil payload JSON dari kiriman PWA HP
          echo '${{ github.event.client_payload.asset_data }}' > incoming_payload.json
          
          # Jika file database belum ada, buat baru kosongan
          if [ ! -f database_aset.json ] || [ ! -s database_aset.json ]; then
            echo "[]" > database_aset.json
          fi

          # Gabungkan atau update data lama dengan data baru menggunakan Node.js bawaan server
          node -e '
            const fs = require("fs");
            let currentDB = JSON.parse(fs.readFileSync("database_aset.json", "utf8"));
            const incoming = JSON.parse(fs.readFileSync("incoming_payload.json", "utf8"));
            
            const incomingArr = Array.isArray(incoming) ? incoming : [incoming];
            
            incomingArr.forEach(newAsset => {
              const index = currentDB.findIndex(a => a.id === newAsset.id);
              if (index > -1) {
                currentDB[index] = newAsset;
              } else {
                currentDB.push(newAsset);
              }
            });
            
            fs.writeFileSync("database_aset.json", JSON.stringify(currentDB, null, 2), "utf8");
          '
          rm incoming_payload.json

      - name: Commit and Push Directly to Main Branch
        run: |
          git config --global user.name "PWA Sync Bot"
          git config --global user.email "pwa-bot@github.com"
          git add database_aset.json
          git commit -m "Data Sync: Updated asset database from engineer device [skip ci]" || echo "Tidak ada perubahan data"
          git push origin main
